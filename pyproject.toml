[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coherent-mathematics-experiments"
version = "0.1.0"
description = "Exploratory numerical experiments accompanying CoMath"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jens Deutschmann" }]
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
]

[project.urls]
Repository = "https://github.com/fractaluncertainty/Coherent-Mathematics"

[tool.pytest.ini_options]
testpaths = ["tests"]

